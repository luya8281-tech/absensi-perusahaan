<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi SPPG Onyam Gunung Keler</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f0f2f5;color:#333;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
h1{font-size:1.3rem;text-align:center;color:#1a73e8;margin-bottom:16px}
h2{font-size:1.1rem;color:#333;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px}
input[type=text],input[type=password],select,textarea{width:100%;padding:10px 12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:0.95rem}
button{width:100%;padding:12px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity 0.2s}
button:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:#1a73e8;color:#fff}
.btn-success{background:#0d904f;color:#fff}
.btn-danger{background:#d93025;color:#fff}
.btn-warning{background:#f9ab00;color:#333}
.btn-info{background:#5f6368;color:#fff}
.hidden{display:none!important}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:0.8rem;font-weight:600;margin-right:6px}
.badge-hadir{background:#e6f4ea;color:#0d904f}
.badge-ditolak{background:#fce8e6;color:#d93025}
.badge-izin,.badge-sakit,.badge-cuti{background:#e8f0fe;color:#1a73e8}
.badge-alpa{background:#f1f3f4;color:#5f6368}
.log-item{padding:10px 0;border-bottom:1px solid #f1f3f4;font-size:0.9rem}
.log-item:last-child{border-bottom:none}
.alert{padding:12px;border-radius:8px;margin-bottom:12px;font-size:0.9rem;text-align:center}
.alert-error{background:#fce8e6;color:#d93025;border:1px solid #f5c6cb}
.alert-success{background:#e6f4ea;color:#0d904f;border:1px solid #c3e6cb}
.alert-info{background:#e8f0fe;color:#1a73e8;border:1px solid #b8daff}
.header-info{text-align:center;margin-bottom:16px;font-size:0.95rem;color:#5f6368}
.header-info strong{color:#333;font-size:1.1rem;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:0.85rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8f9fa;font-weight:600;color:#5f6368}
.distance-warn{color:#d93025;font-weight:600;font-size:0.9rem;text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">

<!-- LOGIN -->
<div id="view-login" class="card">
<h1>Absensi SPPG Onyam</h1>
<p style="text-align:center;font-size:0.9rem;color:#5f6368;margin-bottom:16px">Gunung Keler, Kab. Tangerang</p>
<div id="login-alert"></div>
<input type="text" id="login-id" placeholder="ID Karyawan (cth: EMP-001)">
<input type="password" id="login-pass" placeholder="Password">
<button class="btn-primary" onclick="doLogin()">Masuk</button>
</div>

<!-- DASHBOARD KARYAWAN -->
<div id="view-dashboard" class="hidden">
<div class="card header-info">
<strong id="dash-nama"></strong>
<span id="dash-id"></span> &bull; <span id="dash-role"></span>
</div>

<div class="card">
<h2>Absensi Hari Ini</h2>
<div id="absen-alert"></div>
<div id="distance-info" class="distance-warn hidden"></div>
<button class="btn-success" id="btn-masuk" onclick="doAbsen('masuk')">Absen Masuk</button>
<button class="btn-warning" id="btn-pulang" onclick="doAbsen('pulang')">Absen Pulang</button>
</div>

<div class="card">
<h2>Pengajuan Izin / Sakit / Cuti</h2>
<select id="tipe-izin">
<option value="izin">Izin</option>
<option value="sakit">Sakit</option>
<option value="cuti">Cuti</option>
</select>
<textarea id="ket-izin" rows="3" placeholder="Keterangan tambahan..."></textarea>
<button class="btn-info" onclick="doAbsen('pengajuan')">Kirim Pengajuan</button>
</div>

<div class="card">
<h2>Riwayat Kehadiran</h2>
<div id="riwayat-list"><p style="color:#999;font-size:0.9rem">Memuat data...</p></div>
</div>

<button class="btn-danger" onclick="doLogout()" style="margin-top:8px">Keluar</button>
</div>

<!-- DASHBOARD ADMIN -->
<div id="view-admin" class="hidden">
<div class="card header-info">
<strong id="admin-nama"></strong>
<span>Panel Admin</span>
</div>
<div class="card">
<h2>Rekap Seluruh Karyawan</h2>
<div style="overflow-x:auto">
<table id="rekap-table">
<thead><tr><th>ID</th><th>Nama</th><th>Tanggal</th><th>Waktu</th><th>Status</th><th>Jarak</th></tr></thead>
<tbody id="rekap-body"><tr><td colspan="6">Memuat...</td></tr></tbody>
</table>
</div>
</div>
<button class="btn-danger" onclick="doLogout()">Keluar</button>
</div>

</div>

<script>
const OFFICE_LAT = -6.1754;
const OFFICE_LNG = 106.4522;
const MAX_RADIUS = 50;
let currentUser = null;
let currentDistance = null;

function showView(id) {
  document.querySelectorAll('.container > div').forEach(v => v.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function showAlert(elId, msg, type) {
  const el = document.getElementById(elId);
  el.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
  setTimeout(() => el.innerHTML = '', 5000);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!id || !pass) return showAlert('login-alert','ID dan Password wajib diisi.','error');
  try {
    const res = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password:pass})});
    const data = await res.json();
    if (data.success) {
      currentUser = data.data;
      localStorage.setItem('absensi_user', JSON.stringify(currentUser));
      initDashboard();
    } else {
      showAlert('login-alert', data.message, 'error');
    }
  } catch(e) { showAlert('login-alert','Gagal terhubung ke server.','error'); }
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('absensi_user');
  document.getElementById('login-id').value = '';
  document.getElementById('login-pass').value = '';
  showView('view-login');
}

function initDashboard() {
  if (!currentUser) return;
  if (currentUser.role === 'admin') {
    document.getElementById('admin-nama').textContent = currentUser.nama + ' (' + currentUser.id + ')';
    showView('view-admin');
    loadRekap();
  } else {
    document.getElementById('dash-nama').textContent = currentUser.nama;
    document.getElementById('dash-id').textContent = currentUser.id;
    document.getElementById('dash-role').textContent = currentUser.role;
    showView('view-dashboard');
    loadRiwayat();
    getLocation();
  }
}

function getLocation() {
  const distEl = document.getElementById('distance-info');
  if (!navigator.geolocation) { distEl.textContent = 'Browser tidak mendukung GPS.'; distEl.classList.remove('hidden'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    currentDistance = haversine(pos.coords.latitude, pos.coords.longitude, OFFICE_LAT, OFFICE_LNG);
    distEl.textContent = 'Jarak Anda dari kantor: ' + currentDistance.toFixed(1) + ' meter (Maks: ' + MAX_RADIUS + 'm)';
    distEl.classList.remove('hidden');
    if (currentDistance > MAX_RADIUS) {
      document.getElementById('btn-masuk').disabled = true;
      document.getElementById('btn-pulang').disabled = true;
      distEl.style.color = '#d93025';
    } else {
      document.getElementById('btn-masuk').disabled = false;
      document.getElementById('btn-pulang').disabled = false;
      distEl.style.color = '#0d904f';
    }
  }, () => {
    distEl.textContent = 'Akses lokasi ditolak. Absensi GPS tidak tersedia.';
    distEl.classList.remove('hidden');
    distEl.style.color = '#d93025';
    document.getElementById('btn-masuk').disabled = true;
    document.getElementById('btn-pulang').disabled = true;
  });
}

async function doAbsen(tipe) {
  if (!currentUser) return;
  let payload = { karyawan_id: currentUser.id, tipe: tipe };
  if (tipe === 'masuk' || tipe === 'pulang') {
    if (currentDistance === null) return showAlert('absen-alert','Menunggu sinyal GPS...','error');
    payload.jarak_meter = currentDistance;
  } else if (tipe === 'pengajuan') {
    payload.tipe = document.getElementById('tipe-izin').value;
    payload.keterangan = document.getElementById('ket-izin').value;
  }
  try {
    const res = await fetch('/api/absensi', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data = await res.json();
    if (data.success) {
      showAlert('absen-alert', data.message, 'success');
      if (tipe === 'pengajuan') document.getElementById('ket-izin').value = '';
      loadRiwayat();
    } else {
      showAlert('absen-alert', 'Gagal mencatat absensi.', 'error');
    }
  } catch(e) { showAlert('absen-alert','Error koneksi server.','error'); }
}

async function loadRiwayat() {
  if (!currentUser) return;
  try {
    const res = await fetch('/api/admin/rekap');
    const all = await res.json();
    const mine = all.filter(r => r.karyawan_id === currentUser.id && r.tanggal);
    const el = document.getElementById('riwayat-list');
    if (mine.length === 0) { el.innerHTML = '<p style="color:#999;font-size:0.9rem">Belum ada riwayat.</p>'; return; }
    el.innerHTML = mine.slice(0,20).map(r => {
      let bc = 'alpa';
      if (r.status === 'Hadir') bc = 'hadir';
      else if (r.status.includes('Ditolak')) bc = 'ditolak';
      else if (['izin','sakit','cuti'].includes(r.tipe)) bc = r.tipe;
      return '<div class="log-item"><span class="badge badge-'+bc+'">'+r.status.toUpperCase()+'</span> '+r.tanggal+' '+r.waktu+' - '+r.tipe.charAt(0).toUpperCase()+r.tipe.slice(1)+(r.jarak_meter ? ' ('+r.jarak_meter.toFixed(0)+'m)' : '')+(r.keterangan ? '<br><small style="color:#666">'+r.keterangan+'</small>' : '')+'</div>';
    }).join('');
  } catch(e) {}
}

async function loadRekap() {
  try {
    const res = await fetch('/api/admin/rekap');
    const data = await res.json();
    const tbody = document.getElementById('rekap-body');
    const filtered = data.filter(r => r.tanggal);
    if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="6">Belum ada data absensi.</td></tr>'; return; }
    tbody.innerHTML = filtered.slice(0,100).map(r => {
      let bc = 'alpa';
      if (r.status === 'Hadir') bc = 'hadir';
      else if (r.status && r.status.includes('Ditolak')) bc = 'ditolak';
      else if (['izin','sakit','cuti'].includes(r.tipe)) bc = r.tipe;
      return '<tr><td>'+r.id+'</td><td>'+r.nama+'</td><td>'+(r.tanggal||'-')+'</td><td>'+(r.waktu||'-')+'</td><td><span class="badge badge-'+bc+'">'+(r.status||'-')+'</span></td><td>'+(r.jarak_meter ? r.jarak_meter.toFixed(0)+'m' : '-')+'</td></tr>';
    }).join('');
  } catch(e) {}
}

window.onload = () => {
  const saved = localStorage.getItem('absensi_user');
  if (saved) { currentUser = JSON.parse(saved); initDashboard(); }
  else showView('view-login');
};
</script>
</body>
</html>
